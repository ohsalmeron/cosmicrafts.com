server {
    listen 80;
    server_name cosmicrafts.com www.cosmicrafts.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cosmicrafts.com www.cosmicrafts.com;

    include snippets/cloudflare-origin.conf;

    ssl_certificate     /usr/local/etc/nginx/self-signed.crt;
    ssl_certificate_key /usr/local/etc/nginx/self-signed.key;
    include snippets/ssl-params.conf;

    root /var/www/cosmicrafts.com/current;
    index index.html;

    # Unity WebGL brotli builds: .br files must go out with the MIME of the
    # inner file plus Content-Encoding: br, or Unity refuses to boot.
    location ~* \.js\.br$ {
        default_type application/javascript;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.wasm\.br$ {
        default_type application/wasm;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.data\.br$ {
        default_type application/octet-stream;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Trunk/Bevy WASM: streaming compile needs the exact MIME.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Astro hashed output (/_astro/*.abc123.js): unique name per build,
    # safe to cache forever. ^~ wins over the regex below.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (public/: css, images, i18n): stable filenames edited
    # by hand, so 1h + revalidate instead of immutable. immutable here once
    # froze browsers on old CSS for up to a year after each deploy.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2|woff)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }
}
