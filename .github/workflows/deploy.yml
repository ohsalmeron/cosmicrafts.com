name: Deploy Cosmicrafts Static Site to Ionos VPS

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# How this deploys (mirrors the SOW pipeline pattern):
# 1. CI builds the static bundle.
# 2. The bundle goes to a NEW immutable dir: releases/<sha>-<run>.
# 3. The live path /var/www/cosmicrafts.com/current is a symlink;
#    it flips to the new release atomically (never a half-written live dir).
# 4. Only the 5 newest releases are kept (rollback = flip the symlink back).
# 5. Post-deploy checks hit the real site, including the Unity .br
#    encoding header that once took the games down. Any check fails the job.
jobs:
  deploy:
    name: Build Astro & Deploy Static Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Static Astro Bundle
        run: npm run build

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -T 10 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Stage Immutable Release
        run: |
          REL="releases/${{ github.sha }}-${{ github.run_number }}"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/cosmicrafts.com/$REL/"
          echo "staged $REL"

      - name: Activate Release (atomic symlink + retain 5)
        run: |
          # NOTE: the remote script arrives via quoted heredoc so NOTHING
          # expands locally ($link, $$ stay intact for the server shell).
          # A double-quoted ssh string once ate them and the flip silently
          # never happened while the step stayed green. Never go back to that.
          REL="releases/${{ github.sha }}-${{ github.run_number }}"
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "WANT='$REL' bash -s" <<'REMOTE'
          set -eu
          link="/var/www/cosmicrafts.com/.current.$$"
          ln -sfn "$WANT" "$link"
          mv -hf "$link" /var/www/cosmicrafts.com/current
          rm -f /var/www/cosmicrafts.com/current.tmp
          got="$(readlink /var/www/cosmicrafts.com/current)"
          test "$got" = "$WANT" || { echo "FLIP FAILED: current=$got want=$WANT"; exit 1; }
          echo "live now: $got"
          cd /var/www/cosmicrafts.com/releases
          old="$(ls -t | tail -n +6 || true)"
          if [ -n "$old" ]; then echo "$old" | xargs -I{} rm -rf "{}"; fi
          ls
          REMOTE

      - name: Sync nginx conf (versioned in infra/nginx)
        run: |
          # The vhost lives in the repo so every header change is reviewable
          # and reproducible. Backup first (.bak_<ts>), test config, reload.
          scp -o StrictHostKeyChecking=no infra/nginx/cosmicrafts.com.conf \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/cc-nginx.conf"
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'REMOTE'
          set -eu
          live=/usr/local/etc/nginx/conf.d/cosmicrafts.com.conf
          if ! cmp -s /tmp/cc-nginx.conf "$live"; then
            sudo -n cp "$live" "$live.bak_$(date +%s)"
            sudo -n cp /tmp/cc-nginx.conf "$live"
            sudo -n nginx -t
            sudo -n service nginx reload
            sudo -n nginx -T 2>/dev/null | grep -q 'max-age=3600, must-revalidate' \
              || { echo "NGINX POLICY CHECK FAILED"; exit 1; }
            echo "nginx conf updated + reloaded"
          else
            echo "nginx conf unchanged"
          fi
          rm -f /tmp/cc-nginx.conf
          REMOTE

      - name: Verify Live Site
        run: |
          set -e
          base="https://cosmicrafts.com"
          check() { code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1")"; echo "$1 -> $code"; [ "$code" = "200" ]; }
          check "$base/"
          check "$base/games/"
          check "$base/play/beta-2022/"
          check "$base/play/stardrifter/"
          check "$base/play/adventures-bevy/"
          check "$base/games/adventures-3d/Cosmicrafts.loader.js"
          check "$base/whitepaper/"
          curl -s --max-time 30 "$base/" | grep -q "hero-carousel"
          echo "home contains hero carousel: yes"
          curl -s --max-time 30 "$base/games/" | grep -q "game-launcher"
          echo "games page contains library: yes"
          enc="$(curl -sI -H 'Accept-Encoding: gzip, deflate, br, zstd' --max-time 30 "$base/games/adventures-3d/Cosmicrafts.data.br" | tr -d '\r' | grep -i '^content-encoding:' | awk '{print $2}')"
          echo "unity .br content-encoding: $enc"
          [ "$enc" = "br" ]
          curl -s --max-time 30 "$base/play/stardrifter/" | grep -q "stardrifter.cosmicrafts.com"
          echo "stardrifter play embeds subdomain: yes"
          curl -s --max-time 30 "$base/games/adventures-bevy/" | grep -q "_bg.wasm"
          echo "adventures-bevy entry references wasm: yes"
          echo "ALL LIVE CHECKS PASSED"
